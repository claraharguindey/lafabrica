   <style>
      body {
         background-color: #000000;
         margin: 0;
         padding: 0;
         text-align: center;
      }

      img {
         vertical-align: top;
      }

      /* Barra de scroll visible en la parte inferior */
      #scroll-bar {
         position: fixed;
         bottom: 0;
         left: 0;
         width: 100%;
         background-color: #333333;
         overflow: hidden;
         white-space: nowrap;
         z-index: 1000;
         padding: 5px 0;
      }

      #scroll-text {
         display: inline-block;
         color: #00FF00;
         font-family: Arial, Helvetica, sans-serif;
         font-size: 15px;
         white-space: nowrap;
         animation: marquee 30s linear infinite;
      }

      @keyframes marquee {
         0%   { transform: translateX(100vw); }
         100% { transform: translateX(-100%); }
      }
   </style>
</head>

<body>
   <div id="scroll-bar"><span id="scroll-text">Ya no hay acto ni acontecimiento que no se refracte en una imagen técnica o sobre una pantalla, ni una acción que no desee ser fotografiada, filmada, grabada, que no desee confluir en esta memoria y volverse en ella eternamente reproducible</span></div>
